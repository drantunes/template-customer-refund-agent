name: Verify template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-gates:
    runs-on: ubuntu-24.04
    env:
      SUPPORT_SOURCE: mock
      COMMERCE_SOURCE: mock
      E2E_API_PORT: "4111"
      E2E_PORT: "5173"
    steps:
      # v4 (verified upstream ref)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # v4 (verified upstream ref)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Verify pinned runtime
        run: |
          test "$(node --version)" = v24.20.0
          test "$(npm --version)" = 11.19.0
      - name: Install locked workspace
        run: npm ci --no-audit --no-fund
      - name: Install browser for local mock E2E
        run: npx playwright install --with-deps chromium
      - name: Backend format
        run: npm run format:check
      - name: Backend style
        run: npm run lint
      - name: Backend typecheck
        run: npm run typecheck
      - name: Backend unit tests
        run: npm run test:unit
      - name: Backend integration tests
        run: npm run test:integration
      - name: Backend contract tests
        run: npm run test:contract
      - name: Backend evals
        run: npm run test:eval
      - name: Backend build
        run: npm run build
      - name: Customer demo format
        run: npm run --workspace client-demo-ui format:check
      - name: Customer demo style
        run: npm run lint:demo
      - name: Customer demo typecheck
        run: npm run typecheck:demo
      - name: Customer demo unit tests
        run: npm run test:unit:demo
      - name: Customer demo integration tests
        run: npm run test:integration:demo
      - name: Customer demo build
        run: npm run build:demo
      - name: Frontend format
        run: npm run --workspace support-demo-ui format:check
      - name: Frontend style
        run: npm run --workspace support-demo-ui lint
      - name: Frontend typecheck
        run: npm run --workspace support-demo-ui typecheck
      - name: Frontend unit tests
        run: npm run --workspace support-demo-ui test:unit
      - name: Frontend integration tests
        run: npm run --workspace support-demo-ui test:integration
      - name: Frontend contract tests
        run: npm run --workspace support-demo-ui test:contract
      - name: Frontend evals
        run: npm run --workspace support-demo-ui test:eval
      - name: Frontend build
        run: npm run --workspace support-demo-ui build
      - name: Runtime check
        run: npm run check:runtime
      - name: Frozen install check
        run: npm ci --dry-run --ignore-scripts --no-audit --no-fund
      - name: Environment and documentation checks
        run: |
          export LOCAL_AUTH_SIGNING_KEY=ci-local-signing-key-at-least-32-characters
          npm run check:env -- --profile=local --mode=deterministic
          npm run check:docs
      - name: Local mock end-to-end test
        run: npm run test:e2e
      - name: Diff integrity
        run: git diff --check
